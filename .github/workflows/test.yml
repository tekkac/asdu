name: test

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -f tests/Dockerfile -t asdu-smoke .
      - run: docker run --rm --network none asdu-smoke

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - run: uv sync --locked --group dev
      - run: uv run pytest -q
      - run: uv run ruff check .
      - run: uv build
      - name: Smoke-test installed wheel
        shell: pwsh
        run: |
          uv venv .wheel-test
          $wheel = (Get-ChildItem dist\asdu-*.whl | Select-Object -First 1).FullName
          uv pip install --python .wheel-test\Scripts\python.exe $wheel
          Push-Location $env:RUNNER_TEMP
          & "$env:GITHUB_WORKSPACE\.wheel-test\Scripts\python.exe" "$env:GITHUB_WORKSPACE\tests\smoke_install.py"
